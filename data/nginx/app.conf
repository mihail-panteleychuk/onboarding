upstream my_project_upstream {
   server django:80;
}
# upstream excels_upstream {
#    server flask:5000;
# }

server {
   listen 80;
   server_name inhouselight.dataforest.tech;
   client_max_body_size 1024M;
   location /.well-known/acme-challenge/ {
       root /var/www/certbot;
   }
   location / {
       proxy_read_timeout 1800;
       proxy_connect_timeout 1800;
       proxy_send_timeout 1800;
       send_timeout 1800;
       return 301 https://$host$request_uri;
   }
}


server {
   listen 443 ssl;
   server_name inhouselight.dataforest.tech;
   client_max_body_size 1024M;
   ssl_certificate /etc/letsencrypt/live/inhouselight.dataforest.tech/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/inhouselight.dataforest.tech/privkey.pem;
   include /etc/letsencrypt/options-ssl-nginx.conf;
   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

   location / {
       root /srv/www/site_name/frontend_build; # new line added
       try_files $uri $uri/ /index.html; # new
       index index.html index.htm; # new line added
   }

   location /excels {
       alias /srv/www/site_name/frontend_build_excel; # new line added
       try_files $uri $uri/ /index.html; # new
       index index.html index.htm; # new line added
   }

    # location /api/excels/save_file{
    #    proxy_read_timeout 1800;
    #    proxy_connect_timeout 1800;
    #    proxy_send_timeout 1800;
    #    send_timeout 1800;
    #    proxy_pass http://excels_upstream;
    #    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #    proxy_set_header X-Forwarded-Proto https;
    #    proxy_set_header Host $host;
    #    proxy_redirect off;

    # }

   location /api/ {
       proxy_pass http://my_project_upstream;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto https;
       proxy_set_header Host $host;
       proxy_redirect off;
   }
}

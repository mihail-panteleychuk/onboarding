global:
  scrape_interval:     15s
  scrape_timeout:      5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    # To monitor Prometheus
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: flower
    # Flower metrics to track Celery tasks
    static_configs:
      - targets: ['celery_flower:5555']

  - job_name: redis-exporter
    static_configs:
      - targets: ['redis-exporter:9121']

  - job_name: celery-exporter
    static_configs:
      - targets: ['celery-exporter:8888']

#  - job_name: rabbitmq-exporter
#    static_configs:
#      - targets: ['rabbitmq-exporter:9419']

# To track some Business metrics, we can add Pushgateway and expose metrics from Django
#  - job_name: pushgateway
#    honor_labels: true
#    static_configs:
#      - targets:
#          - 'pushgateway:9091'

  - job_name: django
    honor_labels: true
    metrics_path: /api/metrics/
    static_configs:
      - targets:
          - 'django:80'

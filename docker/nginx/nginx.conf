
upstream my_project_upstream {
   server python:80;
}


server {
   listen 80;
   server_name test.dropship.dataforest.tech;
   client_max_body_size 10M;
   location / {
       return 301 https://$host$request_uri;
   }
   location /.well-known/acme-challenge/ {
        root /var/www/certbot;
   }
}



server {
   listen 443 ssl;
   server_name test.dropship.dataforest.tech;
   client_max_body_size 10M;
   location / {
       root /var/www/html; # new line added
       try_files $uri $uri/ /index.html; # new
       index index.html index.htm; # new line added
   }
   location /api/ {
       proxy_pass http://my_project_upstream;
       proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
       proxy_set_header X-Forwarded-Proto https;
       proxy_set_header Host $host;
       proxy_redirect off;
   }

}

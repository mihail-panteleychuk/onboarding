name: CD for Dropship-develop-instance

on:
  push:
    branches:
      - Develop11
jobs:

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - name: executing remote ssh commands using password
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST_IP }}
        username: 'ubuntu'
        key: ${{ secrets.HOST_PASSWORD }}
        port: '22'
        script: |
          mkdir -p /home/ubuntu/site_name
          cd /home/ubuntu/site_name
          git pull
          sudo docker-compose -f docker-compose.server.yml up --build --no-recreate -d db nginx
          sudo docker-compose -f docker-compose.server.yml up --build -d django
          sudo docker exec django python3 manage.py makemigrations --noinput
          sudo docker exec django python3 manage.py migrate --noinput
          sudo docker exec django python3 manage.py compilemessages
          sudo docker restart django nginx
